<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>UrbanSight AI - Mobile Urban Intelligence Platform</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Tailwind CSS CDN & Inline Theme Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#b4c5ff",
            "inverse-on-surface": "#2e3132",
            "surface-variant": "#323536",
            "on-secondary-fixed-variant": "#3f465f",
            "on-tertiary-container": "#eaf1ff",
            "error": "#ffb4ab",
            "secondary": "#bfc5e4",
            "outline-variant": "#434655",
            "surface-bright": "#373a3b",
            "tertiary-container": "#646e7e",
            "secondary-container": "#424862",
            "on-primary-fixed-variant": "#003ea8",
            "tertiary-fixed": "#d9e3f6",
            "outline": "#8d90a0",
            "on-tertiary-fixed": "#121c2a",
            "surface-container-highest": "#323536",
            "surface-container-lowest": "#0c0f10",
            "on-surface-variant": "#c3c6d7",
            "on-primary-fixed": "#00174b",
            "inverse-surface": "#e1e3e4",
            "surface-container-low": "#191c1d",
            "tertiary": "#bdc7d9",
            "on-secondary-fixed": "#141a32",
            "secondary-fixed": "#dce1ff",
            "surface-container": "#1d2021",
            "primary-fixed": "#dbe1ff",
            "primary-fixed-dim": "#b4c5ff",
            "on-tertiary": "#27313f",
            "on-error": "#690005",
            "tertiary-fixed-dim": "#bdc7d9",
            "on-surface": "#e1e3e4",
            "on-error-container": "#ffdad6",
            "surface": "#111415",
            "on-tertiary-fixed-variant": "#3d4756",
            "background": "#111415",
            "error-container": "#93000a",
            "on-secondary-container": "#b1b7d6",
            "surface-container-high": "#282a2b",
            "primary": "#b4c5ff",
            "on-primary": "#002a78",
            "secondary-fixed-dim": "#bfc5e4",
            "on-primary-container": "#eeefff",
            "surface-dim": "#111415",
            "on-secondary": "#292f48",
            "on-background": "#e1e3e4",
            "inverse-primary": "#0053db",
            "primary-container": "#2563eb"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #111415;
      color: #e1e3e4;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Custom Leaflet Dark Popup Styles */
    .dark-leaflet-popup .leaflet-popup-content-wrapper {
      background-color: #191c1d !important;
      color: #e1e3e4 !important;
      border: 1px solid #434655 !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
      padding: 0 !important;
    }
    .dark-leaflet-popup .leaflet-popup-tip {
      background-color: #191c1d !important;
    }
    .leaflet-container {
      background-color: #0c0f10 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-surface text-on-surface antialiased selection:bg-primary/30 selection:text-primary">
  <div id="app" class="min-h-screen flex flex-col"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
