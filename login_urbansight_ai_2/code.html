<script>
  function simulateLogin(btn) {
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Authenticating Node...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Access Granted</span>';

      btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');

  }
